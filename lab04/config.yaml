# Lab 4 pipeline configuration (read by src/config.py with PyYAML)
dataset:
  name: adult
  version: 2
  source: OpenML (fetch_openml)
seed: 42
split:
  test_size: 0.30
  stratify: income
imputation:
  numeric: median
  categorical: most_frequent
clipping:
  lower_percentile: 1
  upper_percentile: 99
duplicates: drop exact duplicates from train only
derived_features:
  - capital_net = capital-gain - capital-loss
  - hours_per_age = hours-per-week / (age - 16)
baseline_model:
  type: LogisticRegression
  max_iter: 1000
label_audit:
  sample_size: 50
