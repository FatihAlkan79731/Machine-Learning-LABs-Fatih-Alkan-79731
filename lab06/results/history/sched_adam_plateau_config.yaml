experiment: lab06-fashion-mnist-cnn
seed: 42
data:
  dataset: FashionMNIST
  root: data
  val_size: 5000
  batch_size: 128
  num_workers: 0
  persistent_workers: false
  pin_memory: false
  normalize_mean: 0.286
  normalize_std: 0.353
model:
  name: CNN
optimizer:
  name: adam
  lr: 0.001
  momentum: 0.9
  weight_decay: 0.0
scheduler:
  name: plateau
  step_size: 5
  gamma: 0.1
  t_max: 10
  eta_min: 0.0
  factor: 0.1
  patience: 1
training:
  epochs: 10
  grad_accum_steps: 1
  device: cpu
checkpoint:
  dir: lab06/checkpoints
  every_epoch: true
mlflow:
  tracking_uri: lab06/mlruns
  log_model_checkpoint: true
